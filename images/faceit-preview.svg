<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc">
<title id="title">Faceit-Simple for CS2</title>
<desc id="desc">Dark banner with the plugin name and a mock of the knife-round vote card on the right.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2=".5"><stop stop-color="#0b0e13"/><stop offset="1" stop-color="#1d1207"/></linearGradient>
  <linearGradient id="hot" x2="1"><stop stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff5500"/></linearGradient>
</defs>
<rect width="1000" height="250" rx="12" fill="url(#bg)"/>
<g font-family="Arial, sans-serif">
  <text x="50" y="72" fill="#ffb27a" font-size="19" letter-spacing="3">COUNTER-STRIKE 2  /  COUNTERSTRIKEShARP</text>
  <text x="48" y="140" fill="#f7f9fc" font-weight="bold" font-size="57">Faceit-Simple</text>
  <text x="51" y="184" fill="#a8b1bd" font-size="19">Rimmer   ·   v0.1.1</text>
  <g font-size="15" letter-spacing="4" font-weight="bold">
    <rect x="50" y="200" width="104" height="28" rx="6" fill="#141b24" stroke="#ff550066"/>
    <text x="102" y="220" fill="#ffb27a" text-anchor="middle" letter-spacing="2">WARMUP</text>
    <rect x="164" y="200" width="86" height="28" rx="6" fill="#141b24" stroke="#ff550066"/>
    <text x="207" y="220" fill="#ffb27a" text-anchor="middle" letter-spacing="2">KNIFE</text>
    <rect x="260" y="200" width="76" height="28" rx="6" fill="#141b24" stroke="#ff550066"/>
    <text x="298" y="220" fill="#ffb27a" text-anchor="middle" letter-spacing="2">SIDE</text>
  </g>
  <g>
    <rect x="640" y="38" width="310" height="172" rx="10" fill="#0d1117" stroke="#ff550099" stroke-width="1.5"/>
    <rect x="658" y="56" width="6" height="22" rx="3" fill="url(#hot)"/>
    <text x="676" y="74" fill="#f7f9fc" font-size="17" font-weight="bold" letter-spacing="1">KNIFE ROUND?</text>
    <text x="896" y="74" fill="#ffb27a" font-size="16" font-weight="bold" text-anchor="end">0:27</text>
    <text x="658" y="100" fill="#b8c2ce" font-size="13">First round after warmup — knives only</text>
    <rect x="658" y="116" width="130" height="40" rx="8" fill="#1b2634" stroke="#ff5500"/>
    <text x="723" y="142" fill="#ffb27a" font-size="15" font-weight="bold" text-anchor="middle" letter-spacing="1">YES  1</text>
    <rect x="802" y="116" width="130" height="40" rx="8" fill="#1b2634" stroke="#ff550055"/>
    <text x="867" y="142" fill="#a8b1bd" font-size="15" font-weight="bold" text-anchor="middle" letter-spacing="1">NO  2</text>
    <text x="658" y="186" fill="#7c8794" font-size="12">click the card or type in chat</text>
  </g>
</g>
</svg>
